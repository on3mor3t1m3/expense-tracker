
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Transaction | FinTrack</title>

    {% load static %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'transactions/style.css' %}">

    <style>
        .form-page {
            max-width: 720px;
            margin: 0 auto;
        }

        .form-card {
            padding: 30px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--surface);
        }

        .form-card .form-control,
        .form-card .form-select {
            min-height: 46px;
        }

        .form-card textarea.form-control {
            min-height: 110px;
        }

        .form-card .form-label {
            display: block;
            margin-bottom: 9px;
        }

        .form-description {
            margin-bottom: 26px;
            color: var(--muted);
            font-size: 13px;
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 26px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 11px 17px;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            text-decoration: none;
        }

        .btn-back:hover {
            background: var(--surface-hover);
            color: white;
        }

        @media (max-width: 576px) {
            .form-card {
                padding: 20px;
            }

            .form-buttons {
                flex-direction: column;
            }

            .form-buttons .btn,
            .form-buttons a {
                width: 100%;
            }
        }
    </style>
</head>

<body class="finance-body">
    <nav class="finance-navbar">
        <div class="container finance-container d-flex justify-content-between align-items-center">
            <a class="finance-brand" href="{% url 'home' %}">
                <span class="brand-icon">F</span>
                <span>FinTrack</span>
            </a>
            <span class="navbar-note">PERSONAL FINANCE</span>
        </div>
    </nav>

    <main class="container finance-container py-5">
        <div class="form-page">
            <header class="page-heading">
                <div>
                    <p class="eyebrow">TRANSACTION MANAGEMENT</p>
                    <h1>Edit transaction</h1>
                    <p class="heading-subtitle">
                        Update the details of your transaction.
                    </p>
                </div>
            </header>

            <section class="form-card">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-4">
                        <label for="title" class="form-label">Transaction title</label>
                        <input
                            type="text"
                            name="title"
                            id="title"
                            class="form-control"
                            value="{{ transaction.title }}"
                            placeholder="e.g. Monthly salary"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="amount" class="form-label">Amount ($)</label>
                        <input
                            type="number"
                            name="amount"
                            id="amount"
                            class="form-control"
                            value="{{ transaction.amount }}"
                            min="0.1"
                            step="0.1"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="transaction_type" class="form-label">
                            Transaction type
                        </label>
                        <select
                            name="transaction_type"
                            id="transaction_type"
                            class="form-select"
                            required
                        >
                            <option value="income"
                                {% if transaction.transaction_type == 'income' %}selected{% endif %}>
                                Income
                            </option>
                            <option value="expense"
                                {% if transaction.transaction_type == 'expense' %}selected{% endif %}>
                                Expense
                            </option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="category" class="form-label">Category</label>
                        <select name="category" id="category" class="form-select" required>
                            <option value="food" data-type="expense"
                                {% if transaction.category == 'food' and transaction.transaction_type == 'expense' %}selected{% endif %}>
                                Food
                            </option>
                            <option value="education" data-type="expense"
                                {% if transaction.category == 'education' and transaction.transaction_type == 'expense' %}selected{% endif %}>
                                Education
                            </option>
                            <option value="transport" data-type="expense"
                                {% if transaction.category == 'transport' and transaction.transaction_type == 'expense' %}selected{% endif %}>
                                Transport
                            </option>
                            <option value="entertainment" data-type="expense"
                                {% if transaction.category == 'entertainment' and transaction.transaction_type == 'expense' %}selected{% endif %}>
                                Entertainment
                            </option>
                            <option value="housing" data-type="expense"
                                {% if transaction.category == 'housing' and transaction.transaction_type == 'expense' %}selected{% endif %}>
                                Housing
                            </option>
                            <option value="health" data-type="expense"
                                {% if transaction.category == 'health' and transaction.transaction_type == 'expense' %}selected{% endif %}>
                                Health
                            </option>
                            <option value="shopping" data-type="expense"
                                {% if transaction.category == 'shopping' and transaction.transaction_type == 'expense' %}selected{% endif %}>
                                Shopping
                            </option>
                            <option value="other" data-type="expense"
                                {% if transaction.category == 'other' and transaction.transaction_type == 'expense' %}selected{% endif %}>
                                Other
                            </option>

                            <option value="freelance" data-type="income"
                                {% if transaction.category == 'freelance' and transaction.transaction_type == 'income' %}selected{% endif %}>
                                Freelance
                            </option>
                            <option value="salary" data-type="income"
                                {% if transaction.category == 'salary' and transaction.transaction_type == 'income' %}selected{% endif %}>
                                Salary
                            </option>
                            <option value="investments" data-type="income"
                                {% if transaction.category == 'investments' and transaction.transaction_type == 'income' %}selected{% endif %}>
                                Investments
                            </option>
                            <option value="other" data-type="income"
                                {% if transaction.category == 'other' and transaction.transaction_type == 'income' %}selected{% endif %}>
                                Other
                            </option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="date" class="form-label">Date</label>
                        <input
                            type="date"
                            name="date"
                            id="date"
                            class="form-control"
                            value="{{ transaction.date|date:'Y-m-d' }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">
                            Description <span style="color: var(--muted)">(optional)</span>
                        </label>
                        <textarea
                            name="description"
                            id="description"
                            class="form-control"
                            rows="3"
                            placeholder="Add some details..."
                        >{{ transaction.description }}</textarea>
                    </div>

                    <div class="form-buttons">
                        <button type="submit" class="btn btn-add">
                            Save changes
                        </button>
                        <a href="{% url 'home' %}" class="btn-back">
                            Cancel
                        </a>
                    </div>
                </form>
            </section>

            <footer class="finance-footer">
                FinTrack <span>·</span> Keep your finances in focus.
            </footer>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const typeSelect = document.getElementById('transaction_type');
            const categorySelect = document.getElementById('category');

            function updateCategories() {
                const type = typeSelect.value;

                Array.from(categorySelect.options).forEach(function (option) {
                    option.hidden = option.dataset.type !== type;
                });

                const selected = categorySelect.selectedOptions[0];

                if (!selected || selected.dataset.type !== type) {
                    const first = Array.from(categorySelect.options).find(
                        function (option) {
                            return option.dataset.type === type;
                        }
                    );

                    if (first) {
                        categorySelect.value = first.value;
                    }
                }
            }

            typeSelect.addEventListener('change', updateCategories);
            updateCategories();
        });
    </script>
</body>
</html>
